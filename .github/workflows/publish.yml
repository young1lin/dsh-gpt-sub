# Publish @young1lin/dsh-gpt-sub to npm via Trusted Publishing (OIDC).
#
# Trigger: pushing a vX.Y.Z tag. Authentication is npm Trusted Publishing —
# the GitHub Actions OIDC token identifies this workflow to npm; there is NO
# NPM_TOKEN / NODE_AUTH_TOKEN secret anywhere. Provenance is generated
# automatically by npm for trusted-publishing uploads, no flag needed.
#
# Requires (one-time, manual):
#   1. the package to already exist on npm — the first publish of a NEW
#      package name is done by hand, because a trusted publisher has nowhere
#      to be configured before the package exists
#   2. npmjs.com → package Settings → Trusted publishing configured with
#      user young1lin / repo dsh-gpt-sub / workflow publish.yml
#
# Node 24 because Trusted Publishing needs npm >= 11.5.1; Node 22's bundled
# npm is older, so the step below upgrades npm only when below that bar.
#
# Unlike the no-build dsh-glm-quota, this package ships lib/ build output:
# lib/ is gitignored, so the workflow builds it before packing. `npm publish`
# also runs prepublishOnly (build + test) as a second belt-and-braces pass.
name: Publish npm package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Reads the pinned version from the packageManager field.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Ensure npm >= 11.5.1 (Trusted Publishing requirement)
        run: |
          npm --version
          if [ "$(printf '%s\n' '11.5.1' "$(npm --version)" | sort -V | head -n1)" != '11.5.1' ]; then
            npm install -g npm@latest
            npm --version
          fi

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME}"
          PKG="v$(node -p "require('./package.json').version")"
          echo "tag: ${TAG}, package.json: ${PKG}"
          if [ "${TAG}" != "${PKG}" ]; then
            echo "git tag ${TAG} does not match package.json version ${PKG}" >&2
            exit 1
          fi

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build (tsc -> lib/)
        run: pnpm build

      - name: Test (vitest)
        run: pnpm test

      - name: Verify publish contents
        run: npm pack --dry-run

      - name: Publish
        run: npm publish
